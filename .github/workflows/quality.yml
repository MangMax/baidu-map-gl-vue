name: Quality

on:
  pull_request:
    branches: [main, 2.x, next]
  push:
    branches: [main, 2.x, next]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # API manifest must not drift from source
      - name: Check API manifest
        run: node scripts/collect-api-manifest.mts --check

      # Behavior snapshot tests (data-driven, no external network/AK)
      - name: Unit & behavior tests
        run: pnpm exec vitest run tests/behavior tests/__smoke__.test.ts

      # Lifecycle leak assertion (100 mount/unmount)
      - name: Lifecycle leak
        run: pnpm exec vitest run tests/behavior/mount-unmount-leak.test.ts

      # v2 build sources removed in M1-08 (next 分支),v2 由 2.x 分支维护
      # Build publication artifacts (rollup es + dist)
      - name: Build package
        run: echo "v2 build sources removed (M1-08); v2 packages maintained on 2.x branch"
      # Package tarball consumer verification
      - name: Verify package consumers
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          node --experimental-strip-types scripts/verify-package.mts
        continue-on-error: true # v2 has known type-resolution gaps; recorded as baseline

      # Package size baseline (no hard gate in v2)
      - name: Record package size
        run: node --experimental-strip-types scripts/collect-package-size.mts

  # v3 package: build + type-check + publint + attw + tarball consumer
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies (pnpm workspace incl. v3)
        run: pnpm install --frozen-lockfile

      - name: Build v3 package (vp pack)
        run: node --experimental-strip-types scripts/build-v3.mts

      - name: publint
        run: |
          cd packages/vue3-baidu-map-gl
          npx -y publint .

      - name: attw (ESM+types contract)
        run: |
          cd packages/vue3-baidu-map-gl
          npx -y @arethetypeswrong/cli --pack . --format table > /tmp/attw.txt 2>&1 || true
          grep -q 'node16 (from ESM).*🟢' /tmp/attw.txt || (cat /tmp/attw.txt; exit 1)

      - name: v3 tarball consumer
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm --filter vue3-baidu-map-gl pack --pack-destination .artifacts
          cd fixtures/v3-consumer
          npm install --no-audit --no-fund --ignore-scripts
          npx vue-tsc --noEmit
          node -e "import('vue3-baidu-map-gl').then(m=>{if(!m.BMap)throw new Error('missing BMap');console.log('consumer OK')})"
