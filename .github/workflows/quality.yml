name: Quality

on:
  pull_request:
    branches: [main, 2.x, next]
  push:
    branches: [main, 2.x, next]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # raw SDK 静态扫描:组件/composables/runtime 禁止访问 BMapGL / BMap
      - name: Check raw SDK boundaries
        run: node --experimental-strip-types scripts/check-raw-sdk.mts

      # 整棵 src 树按白名单校验(driver/client/core-loader/plugins 之外的目录禁止 raw SDK)
      - name: Check raw SDK boundaries (whole src tree)
        run: node --experimental-strip-types scripts/check-raw-sdk.mts --src packages/baidu-map-gl-vue/src

      # v3 组件 manifest 无漂移
      - name: Check v3 API manifest
        run: node --experimental-strip-types scripts/generate-manifest-artifacts.mts --check

      # Capability Catalog 能力矩阵无漂移
      - name: Check capability matrix
        run: node --experimental-strip-types scripts/generate-capability-matrix.mts --check

      # NOTE: `pnpm typecheck:v3` 暂不进门禁 —— 它在 Linux 上无法通过，且原因在上游包：
      #   @baidumap/jsapi-v4-types@4.0.4 的 index.d.ts:67 引用了 core/displayOptions.d.ts，
      #   而实际文件名是 core/DisplayOptions.d.ts。macOS 大小写不敏感所以本地"通过"，
      #   Linux 上解析失败 → DisplayOptions 未声明 → Map.d.ts / MapOptions.d.ts 报 TS2552。
      #   待上游修正，或本仓库确定 workaround（如 entry 旁路 / skipLibCheck 之外的最小方案）后重新加入。

      # Behavior snapshot tests (data-driven, no external network/AK)
      - name: Build v3 artifacts for global bundle tests
        run: node --experimental-strip-types scripts/build-v3.mts

      # 公共声明边界:dist/**/*.d.ts 不得泄漏 BMap.* / 官方类型包引用
      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      # 单一执行入口：tests/behavior + packages/**（含 core/loader 的 Loader 测试），
      # 避免 CI 与本地 `pnpm test:unit` 的执行范围漂移。
      - name: Unit & behavior tests
        run: pnpm test:unit

      # 真实浏览器 smoke（JSAPI 4.0 fixture 档，issue #25）：
      # - 页面直接驱动 src 源码（Vite dev server），不需要先 build；
      # - 外部请求由 CDP 阻断，因此这一步不依赖外网与 AK，结论确定（正是 PR 门禁该有的形态）；
      # - 覆盖默认入口/Map/覆盖物/控件/图层/服务/多地图/重挂载/插件失败不阻塞/retry/未处理异常。
      # runner 自己找 Chromium（SMOKE_BROWSER 或系统 Chrome），不新增 npm 依赖。
      - name: Browser smoke (JSAPI 4.0 fixture, no AK/network)
        run: node --experimental-strip-types tests/browser/jsapi-v4/run.mts --mode=fixture

      # v2 leak assertion removed (v2 sources deleted); v3 lifecycle covered by v3 tests

      # v2 sources removed: repo is v3-only (彻底重构)
      - name: Legacy v2 build
        run: echo "v2 sources removed (v3-only repo)"
      # Package tarball consumer verification
      - name: Verify package consumers
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm --filter baidu-map-gl-vue pack --pack-destination .artifacts
          node --experimental-strip-types scripts/verify-package.mts



  # v3 package: build + type-check + publint + attw + tarball consumer
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (pnpm workspace incl. v3)
        run: pnpm install --frozen-lockfile

      - name: Build v3 package (vp pack)
        run: node --experimental-strip-types scripts/build-v3.mts

      - name: Check public d.ts boundaries
        run: node --experimental-strip-types scripts/check-public-dts.mts

      - name: publint
        run: |
          cd packages/baidu-map-gl-vue
          npx -y publint .

      - name: attw (ESM+types contract)
        run: |
          cd packages/baidu-map-gl-vue
          npx -y @arethetypeswrong/cli --pack . --format table > /tmp/attw.txt 2>&1 || true
          grep -q 'node16 (from ESM).*🟢' /tmp/attw.txt || (cat /tmp/attw.txt; exit 1)

      - name: v3 tarball consumer
        run: |
          rm -rf .artifacts && mkdir -p .artifacts
          pnpm --filter baidu-map-gl-vue pack --pack-destination .artifacts
          cd fixtures/v3-consumer
          npm install --no-audit --no-fund --ignore-scripts
          npx vue-tsc --noEmit
          node -e "import('baidu-map-gl-vue').then(m=>{if(!m.BMap)throw new Error('missing BMap');console.log('consumer OK')})"
